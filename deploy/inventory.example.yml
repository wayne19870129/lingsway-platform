# Copy this file to a local, untracked inventory.yml and replace placeholders.
# Do not put credentials here. Production credentials belong in the target host's
# /opt/lingsway/.env and /etc/lingsway/*.conf with mode 0600.
host: 203.0.113.10
domains:
  site: lingsway.com
  api: api.lingsway.com
  subscription: lingsway.com
providers:
  egress: webshare
  accounting: marzban
  gateway: xray_file
  forwarder: mihomo
  payment: manual
  notify: telegram
  email: noop
  captcha: noop
  storage: r2
features:
  monitoring: false
  probe: false
  socks_1080: false
  restart_transport: false
verification:
  # Set these to read-only commands that query the target's database/API.
  # Empty values fail closed; do not use commands that send messages or write data.
  xray_config_file: /opt/lingsway/data/marzban/xray_config.json
  egress_count_command: ""
  mihomo_listener_count_command: ""
  mihomo_ip_match_command: ""
  capacity_verify_command: ""
