name: Risk classification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # GITHUB_TOKEN-authored PRs/pushes (from claude.yml) don't trigger
  # pull_request events, so claude.yml re-runs this via
  # `gh workflow run risk-classify.yml --ref <branch> -f pull_number=<N>`
  # after creating/updating a PR. pull_number substitutes for the payload's
  # pull_request object, which workflow_dispatch runs don't receive.
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : Number(context.payload.inputs.pull_number);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const low = [
              path => path.startsWith('frontend/'),
              path => path.startsWith('docs/'),
              path => path.startsWith('backend/app/api/'),
              path => path.startsWith('backend/app/domain/'),
              path => path.startsWith('backend/app/schemas/'),
              path => path.startsWith('backend/tests/'),
            ];
            const medium = [
              path => path.startsWith('backend/app/providers/gateway/'),
              path => path.startsWith('backend/app/providers/forwarder/'),
              path => path.startsWith('backend/app/providers/egress/'),
              path => path.startsWith('ops/gateway/'),
              path => path.startsWith('ops/forwarder/'),
              path => path.startsWith('infrastructure/marzban/'),
              path => path.startsWith('infrastructure/compose/'),
            ];
            const isMigration = path => path.startsWith('infrastructure/alembic/versions/');
            const rank = { low: 1, medium: 2, migration: 3, high: 4 };
            const classifyPath = path => {
              if (isMigration(path)) return 'migration';
              if (medium.some(match => match(path))) return 'medium';
              if (low.some(match => match(path))) return 'low';
              return 'high';
            };

            const classified = files.map(file => ({ path: file.filename, risk: classifyPath(file.filename) }));
            const risk = classified.reduce(
              (current, file) => rank[file.risk] > rank[current] ? file.risk : current,
              'low',
            );
            const deployment = {
              low: '自动部署：仅允许 deploy-auto.yml 的 dry-run 流程；真实部署待 T7 接通。',
              medium: '需手动触发 deploy-gateway.yml；该 workflow 当前仅 dry-run，包含 Xray 九步保护骨架。',
              migration: '需手动触发 deploy-migration.yml；执行前强制备份，当前仅 dry-run。',
              high: '禁止自动化部署；需人工在 VPS 执行并单独制定回滚方案。',
            }[risk];

            const riskLabels = ['risk:low', 'risk:medium', 'risk:migration', 'risk:high'];
            for (const label of riskLabels) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pullNumber, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const colors = {
              'risk:low': '0e8a16',
              'risk:medium': 'fbca04',
              'risk:migration': 'd93f0b',
              'risk:high': 'b60205',
            };
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pullNumber, labels: [riskLabels.find(label => label === `risk:${risk}`)] });
            } catch (error) {
              if (error.status !== 422) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: `risk:${risk}`,
                color: colors[`risk:${risk}`],
                description: `Deployment risk: ${risk}`,
              });
              await github.rest.issues.addLabels({ owner, repo, issue_number: pullNumber, labels: [`risk:${risk}`] });
            }

            const marker = '<!-- lingsway-risk-classification -->';
            const lines = classified.length === 0
              ? ['- (no changed files returned by GitHub)']
              : classified.map(file => `- \`${file.path}\` → ${file.risk}`);
            const body = [
              marker,
              `### Risk classification: \`risk:${risk}\``,
              '',
              deployment,
              '',
              'Changed paths:',
              ...lines,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pullNumber, body });
            }
