name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  # See ci.yml: GITHUB_TOKEN-authored PRs/pushes don't trigger pull_request,
  # so claude.yml re-runs this via `gh workflow run security.yml --ref
  # <branch>` after creating/updating a PR. No PR payload is needed here.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject production secret references
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'PROD_[A-Za-z0-9_]+' .github/workflows/ci.yml .github/workflows/security.yml; then
            echo "PROD_* references are forbidden in CI and Security workflows"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip install .
      - run: python -m pip_audit --local --skip-editable

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (retry only on transient registry/network failures)
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=3
          delays=(2 6 18)
          # Signatures of registry/network flakiness, not real audit findings.
          transient_pattern='ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|ECONNREFUSED|E5[0-9]{2}|Service Unavailable|network timeout|socket hang up'
          attempt=1
          while true; do
            npm audit --audit-level=high --json > audit.json 2> audit.err
            code=$?

            if [ "$code" -eq 0 ]; then
              exit 0
            fi

            if jq -e '.vulnerabilities' audit.json >/dev/null 2>&1; then
              echo "npm audit reached the registry and reported real findings; not retrying." >&2
              npm audit --audit-level=high || true
              exit "$code"
            fi

            if grep -Eq "$transient_pattern" audit.err audit.json 2>/dev/null; then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "npm audit failed $max_attempts times due to transient network/registry errors; giving up." >&2
                cat audit.err >&2
                exit "$code"
              fi
              delay="${delays[$((attempt - 1))]}"
              echo "npm audit attempt $attempt/$max_attempts hit a transient error, retrying in ${delay}s..." >&2
              cat audit.err >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              continue
            fi

            echo "npm audit failed with an error that doesn't match known transient patterns; failing without retry." >&2
            cat audit.err >&2
            exit "$code"
          done
