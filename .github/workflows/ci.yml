name: CI

on:
  pull_request:
  push:
    branches: [main]
  # GITHUB_TOKEN-authored pushes/PRs (e.g. from .github/workflows/claude.yml
  # creating or updating a PR) do not trigger pull_request/push events by
  # design (GitHub's anti-recursion rule), so claude.yml explicitly re-runs
  # this workflow via `gh workflow run ci.yml --ref <branch>` after pushing.
  # workflow_dispatch is exempt from that rule, and this job needs no PR
  # payload, so it runs unchanged against whatever ref was dispatched.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject production secret references
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'PROD_[A-Za-z0-9_]+' .github/workflows/ci.yml .github/workflows/security.yml; then
            echo "PROD_* references are forbidden in CI and Security workflows"
            exit 1
          fi
          blocked_name="PROD""_CONSTRUCTED_TEST"
          expression_start='$'"{{ secrets."
          expression_end=" }}"
          printf '%s%s%s\n' "$expression_start" "$blocked_name" "$expression_end" > "$RUNNER_TEMP/prod-reference.yml"
          if ! grep -nE 'PROD_[A-Za-z0-9_]+' "$RUNNER_TEMP/prod-reference.yml"; then
            echo "constructed PROD_* hit was not rejected"
            exit 1
          fi
          echo "constructed PROD_* hit rejected as expected"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: make lint

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck deployment scripts
        run: |
          bash -n deploy/bootstrap.sh deploy/rollback.sh deploy/lib/*.sh
          shellcheck --severity=error deploy/bootstrap.sh deploy/rollback.sh deploy/lib/*.sh

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lingsway_test
          MYSQL_USER: lingsway
          MYSQL_PASSWORD: test-only
          MYSQL_ROOT_PASSWORD: test-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utest --silent || mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+asyncmy://lingsway:test-only@127.0.0.1:3306/lingsway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make test-unit
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build frontend image
        working-directory: ${{ github.workspace }}
        run: docker build -f frontend/Dockerfile -t lingsway-frontend:t5f .

  marzban-contract:
    # TASK-T16 Phase 2B4: the pinned Marzban routing_principal source
    # patch and its contract tests (infrastructure/marzban/patches/) are
    # NOT covered by the `backend` job above -- they depend on Marzban's
    # own pinned dependency versions (pydantic==2.10.4/fastapi==0.115.2),
    # not this repository's backend/pyproject.toml pins, so they run in
    # their own isolated job/runner rather than polluting the backend
    # job's Python environment. Runs unconditionally (like every other
    # job here, not path-filtered) so it can never become a required
    # check that sits permanently pending on PRs that don't touch
    # infrastructure/marzban/**.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Marzban contract dependencies
        # Every package here is pinned to an exact version, pip included --
        # a "pinned contract" gate that installs an unpinned test/tooling
        # dependency isn't actually deterministic: a new httpx or pytest
        # release could turn this job red for reasons having nothing to do
        # with Marzban or this repository's own changes.
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install \
            pydantic==2.10.4 \
            fastapi==0.115.2 \
            starlette==0.40.0 \
            httpx==0.28.1 \
            pytest==9.1.1
      - name: Verify pinned Marzban upstream contract (fail-closed)
        run: python infrastructure/marzban/patches/verify_pinned_upstream.py
      - name: Run Marzban routing_principal patch contract tests
        run: python -m pytest infrastructure/marzban/patches/tests -v

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t lingsway-backend:t4 .
      - name: Verify Xray runtime assets
        run: |
          docker run --rm --entrypoint sh lingsway-backend:t4 -c '
            set -eu
            test "$(command -v xray)" = /usr/local/bin/xray
            test -x /usr/local/bin/xray
            test -s /usr/local/share/xray/geoip.dat
            test -s /usr/local/share/xray/geosite.dat
            xray version
            sha256sum /usr/local/bin/xray \
              /usr/local/share/xray/geoip.dat \
              /usr/local/share/xray/geosite.dat
          '
