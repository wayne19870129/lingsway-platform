name: CI

on:
  pull_request:
  push:
    branches: [main]
  # GITHUB_TOKEN-authored pushes/PRs (e.g. from .github/workflows/claude.yml
  # creating or updating a PR) do not trigger pull_request/push events by
  # design (GitHub's anti-recursion rule), so claude.yml explicitly re-runs
  # this workflow via `gh workflow run ci.yml --ref <branch>` after pushing.
  # workflow_dispatch is exempt from that rule, and this job needs no PR
  # payload, so it runs unchanged against whatever ref was dispatched.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject production secret references
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'PROD_[A-Za-z0-9_]+' .github/workflows/ci.yml .github/workflows/security.yml; then
            echo "PROD_* references are forbidden in CI and Security workflows"
            exit 1
          fi
          blocked_name="PROD""_CONSTRUCTED_TEST"
          expression_start='$'"{{ secrets."
          expression_end=" }}"
          printf '%s%s%s\n' "$expression_start" "$blocked_name" "$expression_end" > "$RUNNER_TEMP/prod-reference.yml"
          if ! grep -nE 'PROD_[A-Za-z0-9_]+' "$RUNNER_TEMP/prod-reference.yml"; then
            echo "constructed PROD_* hit was not rejected"
            exit 1
          fi
          echo "constructed PROD_* hit rejected as expected"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: make lint

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck deployment and workflow-helper scripts
        # TASK-T20 (Issue #71, independent review round 1, Minor): also
        # covers scripts/*.sh -- the claude.yml workflow-helper scripts
        # (deterministic PR-creation/dispatch and run-summary, added by
        # TASK-T20) and the concurrency-group validation script (TASK-T19)
        # -- so a regression in any of them is caught automatically instead
        # of relying only on the manual checks reported in each of those
        # PRs.
        run: |
          bash -n deploy/bootstrap.sh deploy/rollback.sh deploy/lib/*.sh scripts/*.sh scripts/tests/*.sh
          shellcheck --severity=error deploy/bootstrap.sh deploy/rollback.sh deploy/lib/*.sh scripts/*.sh scripts/tests/*.sh

  # TASK-T20 (Issue #71 review round 2): actually run the deterministic
  # Claude-workflow helper scripts' regression tests in CI, rather than
  # relying only on a PR description's report of a one-off local run.
  # Covers: normal PR-creation/reuse/no-op behavior; the round-1 "Major 1"
  # false-completion regression (an existing PR-rework branch already ahead
  # of base before a failed run must not be reported as having produced new
  # work); the round-1 "Major 2" regression (refusing a second PR for the
  # same Issue); and the round-2 same-Issue GraphQL preflight filter. Does
  # not (and, from inside CI, cannot) exercise real GitHub Actions
  # branch-switching or GraphQL behavior -- see
  # scripts/tests/test-claude-workflow-trust-boundary.sh and
  # docs/82-tasks/TASK-T20-*.md for what remains unverified until a real
  # post-merge run.
  claude-workflow-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate claude.yml YAML syntax
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/claude.yml'))"
      - name: Trust-boundary static guard (Critical finding regression)
        run: bash scripts/tests/test-claude-workflow-trust-boundary.sh
      - name: PR-creation/reuse/no-op + false-completion-marker + duplicate-PR regression
        run: bash scripts/tests/test-claude-ensure-pr-and-dispatch.sh
      - name: Same-Issue duplicate-PR prevention preflight filter
        run: bash scripts/tests/test-claude-issue-open-pr-filter.sh

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lingsway_test
          MYSQL_USER: lingsway
          MYSQL_PASSWORD: test-only
          MYSQL_ROOT_PASSWORD: test-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utest --silent || mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+asyncmy://lingsway:test-only@127.0.0.1:3306/lingsway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make test-unit
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build frontend image
        working-directory: ${{ github.workspace }}
        run: docker build -f frontend/Dockerfile -t lingsway-frontend:t5f .

  marzban-contract:
    # TASK-T16 Phase 2B4: the pinned Marzban routing_principal source
    # patch and its contract tests (infrastructure/marzban/patches/) are
    # NOT covered by the `backend` job above -- they depend on Marzban's
    # own pinned dependency versions (pydantic==2.10.4/fastapi==0.115.2),
    # not this repository's backend/pyproject.toml pins, so they run in
    # their own isolated job/runner rather than polluting the backend
    # job's Python environment. Runs unconditionally (like every other
    # job here, not path-filtered) so it can never become a required
    # check that sits permanently pending on PRs that don't touch
    # infrastructure/marzban/**.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify dependency lock consistency (fail-closed)
        # Checked BEFORE installing anything -- a stale/hand-edited lock
        # should fail fast, using only the standard library, not after
        # already spending an install step on it.
        run: python infrastructure/marzban/patches/lock_consistency.py
      - name: Install locked Marzban contract dependencies
        # requirements-contract.txt (generated by pip-tools -- see
        # ../infrastructure/marzban/patches/README.md's "Reproducible
        # dependency lock" section) pins every top-level AND transitive
        # dependency to an exact version with sha256 hashes.
        # --require-hashes makes pip refuse to install anything not
        # listed with a matching hash, so this step fails closed rather
        # than silently falling back to an unpinned/unverified resolve.
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r infrastructure/marzban/patches/requirements-contract.txt
      - name: Verify pinned Marzban upstream contract (fail-closed)
        run: python infrastructure/marzban/patches/verify_pinned_upstream.py
      - name: Run Marzban routing_principal patch contract tests
        run: python -m pytest infrastructure/marzban/patches/tests -v

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t lingsway-backend:t4 .
      - name: Verify Xray runtime assets
        run: |
          docker run --rm --entrypoint sh lingsway-backend:t4 -c '
            set -eu
            test "$(command -v xray)" = /usr/local/bin/xray
            test -x /usr/local/bin/xray
            test -s /usr/local/share/xray/geoip.dat
            test -s /usr/local/share/xray/geosite.dat
            xray version
            sha256sum /usr/local/bin/xray \
              /usr/local/share/xray/geoip.dat \
              /usr/local/share/xray/geosite.dat
          '
