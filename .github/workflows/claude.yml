name: Claude Code

# Lets a repository collaborator with write access trigger a Claude Code
# session by mentioning @claude in an issue comment or a PR review comment.
# See docs/82-tasks/TASK-T17-claude-code-github-action.md for the design
# constraints (minimal permissions, no self-merge/close/deploy, auth choice).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Pinned to a reviewed commit SHA, not a mutable tag: both actions get
      # repo-write permissions and, for claude-code-action, the
      # CLAUDE_CODE_OAUTH_TOKEN secret, so a retargeted tag would run with
      # that authority. Bump the SHA (and this comment) via a reviewed PR,
      # e.g. from Dependabot's github-actions ecosystem updates.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --append-system-prompt "This repository's AGENTS.md and CLAUDE.md govern how you work here and take precedence over convenience. Never merge, approve, or close a pull request. Never trigger, approve, or perform a production deployment (this repository's deploy-*.yml workflows are manual workflow_dispatch only -- do not attempt to invoke them). ${{ (github.event.pull_request != null || github.event.issue.pull_request != null) && 'This trigger is a comment on an existing pull request: push any fix directly to that pull request''s current branch (already checked out). Never open a second pull request for the same task -- this repository requires one task, one PR.' || 'This trigger is a comment on a GitHub Issue, not a pull request: implement the request on a new branch. This action does not auto-create a pull request by default -- it pushes the branch and surfaces its own link to a pre-filled PR-creation page. Do not attempt to force-create a pull request through a separate API call; let that normal flow produce the link for a human to click.' }}"
