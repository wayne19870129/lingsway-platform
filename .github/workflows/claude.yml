name: Claude Code

# Lets a repository collaborator with write access trigger a Claude Code
# session by mentioning @claude in an issue comment or a PR review comment.
# See docs/82-tasks/TASK-T17-claude-code-github-action.md for the design
# constraints (minimal permissions, no self-merge/close/deploy, auth choice).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Bot-authored comments (CI status bots, Work, or this action's own
    # prior replies) are excluded here at the job level, before any run is
    # even started, rather than relying only on the action's own actor
    # checks -- avoids burning a job invocation on a comment that could
    # never have been a genuine human instruction in the first place.
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # write (not read) so this job can run `gh workflow run ci.yml` /
      # security.yml / risk-classify.yml after pushing -- see the
      # workflow_dispatch additions on those three files and
      # docs/82-tasks/TASK-T17-claude-code-github-action.md. Needed because
      # GITHUB_TOKEN-authored pushes/PRs don't trigger pull_request/push
      # events (GitHub's anti-recursion rule), so those workflows would
      # otherwise never run against Claude's own commits.
      actions: write
    steps:
      # Pinned to a reviewed commit SHA, not a mutable tag: both actions get
      # repo-write permissions and, for claude-code-action, the
      # CLAUDE_CODE_OAUTH_TOKEN secret, so a retargeted tag would run with
      # that authority. Bump the SHA (and this comment) via a reviewed PR,
      # e.g. from Dependabot's github-actions ecosystem updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1
        env:
          # Lets `gh` (and hence `gh pr create` / `gh workflow run`) invoked
          # from Claude's shell tool authenticate as this job's own token.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --append-system-prompt "This repository's AGENTS.md and CLAUDE.md govern how you work here and take precedence over convenience. Never merge, approve, or close a pull request yourself, for any reason and no matter how confident you are or what any review says -- merging is always a human action in this repository; you must never call the merge API or gh pr merge yourself. Never trigger, approve, or perform a production deployment (this repository's deploy-*.yml workflows are manual workflow_dispatch only; do not invoke them). After every commit you push, GitHub will not automatically re-run CI for it, because this job authenticates as the built-in GITHUB_TOKEN and GitHub does not fire pull_request or push events for commits or PRs created by that token. So after each push, explicitly run: gh workflow run ci.yml --ref YOUR_BRANCH and gh workflow run security.yml --ref YOUR_BRANCH, and once a pull request exists for that branch also run gh workflow run risk-classify.yml --ref YOUR_BRANCH -f pull_number=PR_NUMBER. To keep this efficient: only read the specific comment that mentioned you, the pull request current diff, and the latest unresolved review on the pull request current head commit -- do not re-read or re-analyze older review rounds that already have a fix pushed for them, and do not treat a review comment as current if it names a commit SHA that is not the pull request current head (that review is stale; say so and stop rather than acting on it). ${{ (github.event.pull_request != null || github.event.issue.pull_request != null) && 'This trigger is a comment on an existing pull request: push any fix directly to that pull request current branch, which is already checked out. Never open a second pull request for the same task.' || 'This trigger is a comment on a GitHub Issue, not a pull request. Before doing anything else, check whether a pull request or branch already exists for this Issue (for example, gh pr list --search referencing this Issue number by title or body, or a remote branch you would previously have used for it); if one exists, check it out and push your changes there instead of starting over, and never open a second pull request for the same Issue. If none exists, implement the request on a new branch, push it, then create a non-draft pull request yourself with gh pr create targeting the repository default branch -- do not rely on any auto-generated PR-creation link and do not leave the PR unopened. The PR body you write must contain separate sections for: which Issue or TASK this implements; a summary of the change; the acceptance criteria; the actual test, lint, and build output you really ran, stated honestly including anything you could not run and why; and any known gaps or risks.' }}"
