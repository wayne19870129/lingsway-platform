name: Claude Code

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required by Claude Code Action's standard GitHub App authentication.
  id-token: write

jobs:
  claude:
    if: |
      github.event.comment.user.login == 'wayne19870129' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "Create or update a pull request for the requested changes. Never merge or approve pull requests, close issues, delete branches, or trigger deployments. A human must review and merge the pull request."
