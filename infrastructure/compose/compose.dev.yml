services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lingsway_test
      MYSQL_USER: lingsway
      MYSQL_PASSWORD: test-only
      MYSQL_ROOT_PASSWORD: test-root-only
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
