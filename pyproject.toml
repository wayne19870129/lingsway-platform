[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lingsway-platform"
version = "0.1.0"
description = "Provider-pluggable network subscription platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=50,<51",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "pymysql[rsa]>=1.1,<2",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/app/models/*.py" = ["UP037", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app", "backend/tests"]
exclude = ["backend/tests/integration"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
